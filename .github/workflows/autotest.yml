name: Auto-test Workflow

on:
  push:
    branches: [main]
    paths:
      - 'npc/**'
      - 'patch/**'
      - 'abstract-machine/**'
      - 'jyd-tests/**'
      - '.github/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      comment:
        description: '注释 (可为空)'
        required: false
        default: ''

run-name: >-
  ${{
    github.event_name == 'push' && github.event.head_commit.message ||
    github.event_name == 'pull_request' && github.event.pull_request.title ||
    github.event.inputs.comment != '' && github.event.inputs.comment ||
    'Manual trigger'
  }}

permissions:
  contents: read
  issues: write

env:
  OSS_CAD_SUITE_RELEASE_TAG: 2025-11-24

jobs:
  setup:
    uses: ./.github/workflows/reusable-setup.yml
    secrets: inherit

  hello:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Common operations
        uses: ./.github/actions/common
        with:
          MAKEFLAGS: ${{ needs.setup.outputs.MAKEFLAGS }}

      - name: hello
        run: |
          KEY=$(head -c 5 /dev/urandom | base32)
          python $MONITOR_PY --middle="Hello, AbstractMachine!" --good=$KEY make ARCH=riscv32-jyd -C am-kernels/kernels/hello run mainargs=$KEY

  basic-tests:
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        test-set:
          - dir: am-kernels/tests/cpu-tests
            args: ""
            precompile: true
          - dir: riscv-tests-am
            args: "TEST_ISA=i"
            precompile: true
          - dir: riscv-arch-test-am-jyd
            args: 'TEST_ISA="I M Zicsr"'
            precompile: false
          - dir: riscv-arch-test-am-jyd
            args: >-
              TEST_ISA="Zba Zbb Zbc Zbkb Zbkc Zbkx Zbs"
              EXCLUDE_TEST="clmulr-00 xperm8-00 brev8-00 packh-00 unzip-00 zip-00"
            precompile: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Common operations
        uses: ./.github/actions/common
        with:
          MAKEFLAGS: ${{ needs.setup.outputs.MAKEFLAGS }}

      - name: Make Binary
        run: |
          # make sim binary first to avoid parallel build issue
          make ARCH=riscv32-jyd -C npc

      - name: Make precompile test set
        if: matrix.test-set.precompile
        run: |
          make ARCH=riscv32-jyd -C ${{ matrix.test-set.dir }}

      - name: Run basic test (${{ matrix.test-set.dir }})
        run: |
          make ARCH=riscv32-jyd -C ${{ matrix.test-set.dir }} run ${{ matrix.test-set.args }}

  rtthread-nano:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Common operations
        uses: ./.github/actions/common
        with:
          MAKEFLAGS: ${{ needs.setup.outputs.MAKEFLAGS }}

      - name: Install dependency
        run: >-
          sudo apt install -y binutils-riscv64-linux-gnu libc6-dev-riscv64-cross
          libgmp-dev libmpfr-dev libmpc-dev flex bison gawk texinfo zlib1g-dev

      - name: Cache patched GCC toolchain
        id: md-gcc-cache
        uses: actions/cache@v5
        with:
          path: md-gcc
          key: ${{ runner.os }}-md-gcc-${{ hashFiles('jyd-tests/coremark-official/accel/gcc-md/active-accel-gcc16.patch') }}-v3

      - name: Build patched GCC
        if: steps.md-gcc-cache.outputs.cache-hit != 'true'
        run: |
          ./jyd-tests/coremark-official/accel/gcc-md/build-md-gcc.sh "$GITHUB_WORKSPACE/md-gcc"

      - name: Build NPC sim
        run: |
          make ARCH=riscv32-jyd -C npc

      - name: Build rtthread-nano image
        run: |
          make ARCH=riscv32-jyd -C jyd-tests/rtthread-nano \
            CROSS_COMPILE=$GITHUB_WORKSPACE/md-gcc/bin/riscv64-linux-gnu- \
            COREMARK_ITERATIONS=1

      - name: rtthread-nano
        run: |
          python $MONITOR_PY make ARCH=riscv32-jyd -C jyd-tests/rtthread-nano \
            CROSS_COMPILE=$GITHUB_WORKSPACE/md-gcc/bin/riscv64-linux-gnu- \
            COREMARK_ITERATIONS=1 run
