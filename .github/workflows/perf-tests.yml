name: Performance Tests Workflow

on:
  push:
    branches: [main]
    paths:
      - 'npc/design/**'
      - 'jyd-tests/**'
      - '.github/workflows/perf-tests.yml'
      - '.github/workflows/reusable-setup.yml'
      - '.github/actions/common/action.yml'
  workflow_dispatch:
    inputs:
      comment:
        description: '注释 (可为空)'
        required: false
        default: ''

run-name: >-
  ${{
    github.event_name == 'push' && github.event.head_commit.message ||
    github.event.inputs.comment != '' && github.event.inputs.comment ||
    'Manual trigger'
  }}

permissions:
  contents: read

env:
  OSS_CAD_SUITE_RELEASE_TAG: 2025-11-24

jobs:
  setup:
    uses: ./.github/workflows/reusable-setup.yml
    secrets: inherit

  microbench:
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        scale: [test, train, ref]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Common operations
        uses: ./.github/actions/common
        with:
          MAKEFLAGS: ${{ needs.setup.outputs.MAKEFLAGS }}

      - name: microbench
        run: |
          make ARCH=riscv32-jyd -C am-kernels/benchmarks/microbench run mainargs=${{ matrix.scale }} VSIM_print_fullperf=1

  coremark-am:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Common operations
        uses: ./.github/actions/common
        with:
          MAKEFLAGS: ${{ needs.setup.outputs.MAKEFLAGS }}

      - name: coremark-am
        run: |
          make ARCH=riscv32-jyd -C am-kernels/benchmarks/coremark run VSIM_print_fullperf=1

  coremark-official:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Common operations
        uses: ./.github/actions/common
        with:
          MAKEFLAGS: ${{ needs.setup.outputs.MAKEFLAGS }}

      - name: Install dependency
        run: >-
          sudo apt install -y binutils-riscv64-linux-gnu libc6-dev-riscv64-cross
          libgmp-dev libmpfr-dev libmpc-dev flex bison gawk texinfo zlib1g-dev

      - name: Cache patched GCC toolchain
        id: md-gcc-cache
        uses: actions/cache@v5
        with:
          path: md-gcc
          key: ${{ runner.os }}-md-gcc-${{ hashFiles('jyd-tests/coremark-official/accel/gcc-md/active-accel-gcc16.patch') }}-v2

      - name: Build patched GCC
        if: steps.md-gcc-cache.outputs.cache-hit != 'true'
        run: |
          ./jyd-tests/coremark-official/accel/gcc-md/build-md-gcc.sh "$GITHUB_WORKSPACE/md-gcc"

      - name: Build NPC sim
        run: |
          make ARCH=riscv32-jyd -C npc

      # ITERATIONS=5000 keeps the CI run within the 6h job limit while still
      # exercising the full benchmark; the default 10000 remains for formal runs.
      # The image is compiled with the patched GCC machine-description
      # selection (-mxbmul -mxcrcu8 -mxlistrev -mxdfa4h -mclipped-rising-score-reduce),
      # matching the formal hardware-accelerated image.
      - name: coremark-official
        run: |
          make ARCH=riscv32-jyd -C jyd-tests/coremark-official \
            CROSS_COMPILE=$GITHUB_WORKSPACE/md-gcc/bin/riscv64-linux-gnu- \
            COREMARK_GCC_MD=1 COREMARK_XEXTS= \
            EXTRA_CFLAGS="-mxbmul -mxcrcu8 -mxlistrev -mxdfa4h -mclipped-rising-score-reduce" \
            ITERATIONS=5000 run VSIM_print_fullperf=1
  dhrystone:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Common operations
        uses: ./.github/actions/common
        with:
          MAKEFLAGS: ${{ needs.setup.outputs.MAKEFLAGS }}

      - name: dhrystone
        run: |
          make ARCH=riscv32-jyd -C am-kernels/benchmarks/dhrystone run VSIM_print_fullperf=1

  jyd-tests:
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sample: [src0, src1, src2, withMext-v2, xibei-withMext_clz]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Common operations
        uses: ./.github/actions/common
        with:
          MAKEFLAGS: ${{ needs.setup.outputs.MAKEFLAGS }}

      - name: Build NPC sim with 256KB DRAM
        run: |
          rm -f npc/build/verilog.done
          VSIM_DRAM_KB=256 make -C npc verilog
          make ARCH=riscv32-jyd -C npc

      - name: jyd-tests (${{ matrix.sample }})
        run: |
          make -C jyd-tests run ${{ matrix.sample }} VSIM_print_fullperf=1
