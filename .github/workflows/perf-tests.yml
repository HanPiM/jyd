name: Performance Tests Workflow

on:
  push:
    branches: [main]
    paths:
      - 'npc/design/**'
      - '.github/workflows/perf-tests.yml'
      - '.github/workflows/reusable-setup.yml'
      - '.github/actions/common/action.yml'
  workflow_dispatch:
    inputs:
      comment:
        description: '注释 (可为空)'
        required: false
        default: ''

run-name: >-
  ${{
    github.event_name == 'push' && github.event.head_commit.message ||
    github.event.inputs.comment != '' && github.event.inputs.comment ||
    'Manual trigger'
  }}

permissions:
  contents: read

env:
  OSS_CAD_SUITE_RELEASE_TAG: 2025-11-24

jobs:
  setup:
    uses: ./.github/workflows/reusable-setup.yml
    secrets: inherit

  microbench:
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        scale: [test, train, ref]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Common operations
        uses: ./.github/actions/common
        with:
          MAKEFLAGS: ${{ needs.setup.outputs.MAKEFLAGS }}

      - name: microbench
        run: |
          make ARCH=riscv32-jyd -C am-kernels/benchmarks/microbench run mainargs=${{ matrix.scale }} VSIM_print_fullperf=1

  coremark:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Common operations
        uses: ./.github/actions/common
        with:
          MAKEFLAGS: ${{ needs.setup.outputs.MAKEFLAGS }}

      - name: coremark
        run: |
          make ARCH=riscv32-jyd -C am-kernels/benchmarks/coremark run VSIM_print_fullperf=1

  coremark-official:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Common operations
        uses: ./.github/actions/common
        with:
          MAKEFLAGS: ${{ needs.setup.outputs.MAKEFLAGS }}

      - name: Install dependency
        run: sudo apt install -y g++-13 gcc-13-plugin-dev libgmp-dev

      - name: Build NPC sim
        run: |
          make ARCH=riscv32-jyd -C npc

      # ITERATIONS=2000 keeps the CI run within the 6h job limit while still
      # exercising the full benchmark; the default 10000 remains for formal runs.
      - name: coremark-official
        run: |
          make ARCH=riscv32-jyd -C jyd-tests/coremark-official HOST_CXX=g++-13 ITERATIONS=2000 run VSIM_print_fullperf=1
  dhrystone:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Common operations
        uses: ./.github/actions/common
        with:
          MAKEFLAGS: ${{ needs.setup.outputs.MAKEFLAGS }}

      - name: dhrystone
        run: |
          make ARCH=riscv32-jyd -C am-kernels/benchmarks/dhrystone run VSIM_print_fullperf=1

  jyd-tests:
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sample: [src0, src1, src2, withMext-v2, xibei-withMext_clz]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Common operations
        uses: ./.github/actions/common
        with:
          MAKEFLAGS: ${{ needs.setup.outputs.MAKEFLAGS }}

      - name: Build NPC sim with 256KB DRAM
        run: |
          rm -f npc/build/verilog.done
          VSIM_DRAM_KB=256 make -C npc verilog
          make ARCH=riscv32-jyd -C npc

      - name: jyd-tests (${{ matrix.sample }})
        run: |
          make -C jyd-tests run ${{ matrix.sample }} VSIM_print_fullperf=1
